app = "gta-lorcana-bot"
primary_region = "yyz"

[deploy]
  release_command = "python scripts/sync_commands.py"

[build]

[env]
  PYTHONUNBUFFERED = "1"

# No HTTP service — this is a Discord bot (outbound WebSocket only)
# No ports, no health checks needed

# Give up after 3 crash-restarts. A stopped machine is then brought back by
# .github/workflows/fly-watchdog.yml, which checks every 30 minutes.
[[restart]]
  policy = "on-failure"
  retries = 3
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[machines]
  # Keep exactly one machine running at all times.
  # This is the critical setting — without it Fly.io scales to zero
  # and kills the Discord gateway WebSocket connection.
  min_machines_running = 1